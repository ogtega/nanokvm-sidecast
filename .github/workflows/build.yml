# Builds the device app on every push and pull request; a v* tag also releases it as sidecast.zip.
# The Mac client comes from the release pinned in client.env; the client repository's CI publishes those
# releases here and opens the pull requests that move the pin.
name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
permissions: { contents: write }
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - name: Shim (32-bit ARM; the image's glibc is the minimum the KVM needs, keep it pinned)
        working-directory: app/shim
        run: >-
          docker run --rm --platform linux/arm/v7 -v "$PWD":/src -w /src debian:trixie-20260918-slim sh -c
          'apt-get -qq update && apt-get -qq install -y gcc libc6-dev >/dev/null &&
          gcc -O2 -shared -fPIC -Wl,-soname,libkvm.so.0 -o libkvm.so libkvm_shim.c -ldl -lpthread'
      - run: ./build.sh
        env: { GH_TOKEN: '${{ github.token }}' }
      - uses: actions/upload-artifact@v7
        with: { name: sidecast, path: app/sidecast }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: app
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          zip -qr ../sidecast.zip sidecast
          gh release create "$GITHUB_REF_NAME" ../sidecast.zip --title "Sidecast $GITHUB_REF_NAME" --generate-notes
